<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropCare AI Diagnosis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .hero-section {
            background: linear-gradient(135deg, #198754, #20c997);
            color: white;
            padding: 3rem 0;
            border-bottom: 5px solid #146c43;
        }

        .upload-card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: none;
        }

        #imagePreview {
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px;
            display: none;
        }

        #resultSection {
            display: none;
        }
    </style>
</head>

<body>

    <div class="hero-section text-center mb-5">
        <h1 class="display-4 fw-bold">CropCare AI</h1>
        <p class="lead">Instant, highly accurate plant disease detection.</p>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card upload-card p-4">
                    <h4 class="text-center mb-4">Upload a Leaf Image</h4>

                    <form id="uploadForm">
                        <div class="mb-3">
                            <input class="form-control form-control-lg" type="file" id="fileInput" accept="image/*"
                                required>
                        </div>
                        <div class="text-center mb-3">
                            <img id="imagePreview" class="img-fluid w-100 mb-3" alt="Image Preview">
                        </div>
                        <button type="submit" class="btn btn-success btn-lg w-100" id="analyzeBtn">Analyze
                            Image</button>
                    </form>

                    <div id="loading" class="text-center mt-4" style="display: none;">
                        <div class="spinner-border text-success" role="status"></div>
                        <p class="mt-2 text-muted">Running AI Model...</p>
                    </div>

                    <div id="resultSection" class="alert alert-success mt-4 text-center">
                        <h3 id="diseaseName" class="fw-bold mb-1"></h3>
                        <p class="mb-0">Confidence: <span id="confidenceScore" class="fw-bold"></span>%</p>
                    </div>

                    <div id="errorSection" class="alert alert-danger mt-4 text-center" style="display: none;">
                        <p id="errorMessage" class="mb-0"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const uploadForm = document.getElementById('uploadForm');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');
        const errorSection = document.getElementById('errorSection');
        const analyzeBtn = document.getElementById('analyzeBtn');

        // Show image preview when file is selected
        fileInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    resultSection.style.display = 'none';
                    errorSection.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // Handle form submission via Fetch API
        uploadForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            // UI updates
            loading.style.display = 'block';
            resultSection.style.display = 'none';
            errorSection.style.display = 'none';
            analyzeBtn.disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                loading.style.display = 'none';
                analyzeBtn.disabled = false;

                if (data.success) {
                    document.getElementById('diseaseName').textContent = data.disease;
                    document.getElementById('confidenceScore').textContent = data.confidence;

                    // Change alert color based on disease (red for disease, green for healthy)
                    if (data.disease.toLowerCase().includes('healthy')) {
                        resultSection.className = 'alert alert-success mt-4 text-center';
                    } else {
                        resultSection.className = 'alert alert-warning mt-4 text-center';
                    }
                    resultSection.style.display = 'block';
                } else {
                    document.getElementById('errorMessage').textContent = "Error: " + data.error;
                    errorSection.style.display = 'block';
                }
            } catch (error) {
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
                document.getElementById('errorMessage').textContent = "Server connection failed.";
                errorSection.style.display = 'block';
            }
        });
    </script>
</body>

</html>
