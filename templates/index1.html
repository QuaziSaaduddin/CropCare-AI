<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropCare AI Diagnosis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Google-like Clean UI CSS */
        body {
            background-color: #f0f2f5;
            font-family: 'Roboto', sans-serif;
            color: #3c4043;
        }

        .header-bg {
            background-color: #ffffff;
            border-bottom: 1px solid #dadce0;
            padding: 2rem 0;
            text-align: center;
        }

        .header-title {
            color: #1a73e8;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .section-title {
            font-weight: 500;
            color: #202124;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        /* Card Styling */
        .google-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #dadce0;
            box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
            transition: box-shadow 0.2s ease-in-out;
            height: 100%;
        }

        .google-card:hover {
            box-shadow: 0 1px 3px 0 rgba(60, 64, 67, 0.3), 0 4px 8px 3px rgba(60, 64, 67, 0.15);
        }

        /* Buttons */
        .btn-google {
            background-color: #1a73e8;
            color: white;
            border-radius: 8px;
            font-weight: 500;
            padding: 10px 24px;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-google:hover {
            background-color: #1557b0;
            color: white;
        }

        .btn-google:disabled {
            background-color: #8ab4f8;
        }

        .btn-wiki {
            border: 1px solid #dadce0;
            color: #1a73e8;
            background: white;
            font-weight: 500;
            border-radius: 8px;
            padding: 8px 16px;
            transition: background 0.2s;
        }

        .btn-wiki:hover {
            background: #f8f9fa;
            color: #1557b0;
        }

        /* File Input */
        .form-control-file {
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 0.5rem;
            width: 100%;
            background: #f8f9fa;
        }

        .image-preview {
            max-height: 200px;
            object-fit: contain;
            border-radius: 8px;
            display: none;
            background: #f8f9fa;
            border: 1px dashed #dadce0;
            margin: 0 auto;
        }

        /* Supported Crops Tags */
        .crop-category {
            background: #e8f0fe;
            color: #1967d2;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid #1967d2;
        }

        .crop-tag {
            display: inline-block;
            background: #ffffff;
            border: 1px solid #d2e3fc;
            color: #1967d2;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            margin: 4px 2px;
        }

        .remedy-box {
            background-color: #fce8e6;
            border-left: 4px solid #d93025;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            font-size: 0.9rem;
        }

        .healthy-box {
            background-color: #e6f4ea;
            border-left: 4px solid #1e8e3e;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            font-size: 0.9rem;
        }

        .header-logo {
            width: 50px;
            /* Adjust size as needed */
            height: auto;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <header class="header-bg mb-5">
        <div class="container">
            <h1 class="header-title display-5"><img src="/static/images/logo.png" alt="CropCare AI Logo" class="header-logo me-2">CropCare AI
            </h1>
            <p class="text-muted lead mb-0">Empowering farmers with instant, accurate crop disease diagnosis with its
                remedies.</p>
        </div>
    </header>

    <div class="container pb-5">

        <div class="row mb-5">
            <div class="col-12">
                <h2 class="section-title">Supported Crops</h2>
                <div class="row">
                    <div class="col-md-4">
                        <div class="crop-category">
                            <h5 class="mb-3 fw-bold">🌾 Grain Crops</h5>
                            <span class="crop-tag">Corn (Maize)</span>
                            <span class="crop-tag">Rice</span>
                            <span class="crop-tag">Wheat</span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="crop-category"
                            style="background:#e6f4ea; color:#137333; border: 1px solid #137333;">
                            <h5 class="mb-3 fw-bold">🌿 Cash Crops</h5>
                            <span class="crop-tag" style="border-color:#ceead6; color:#137333;">Cotton</span>
                            <span class="crop-tag" style="border-color:#ceead6; color:#137333;">Sugarcane</span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="crop-category"
                            style="background:#fce8e6; color:#c5221f; border: 1px solid #c5221f;">
                            <h5 class="mb-3 fw-bold">🍅 Veg & Fruit Crops</h5>
                            <span class="crop-tag" style="border-color:#fad2cf; color:#c5221f;">Tomato</span>
                            <span class="crop-tag" style="border-color:#fad2cf; color:#c5221f;">Potato</span>
                            <span class="crop-tag" style="border-color:#fad2cf; color:#c5221f;">Pepper (Bell)</span>
                            <span class="crop-tag" style="border-color:#fad2cf; color:#c5221f;">Grape</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <hr style="border-color: #dadce0;" class="mb-3">

        <h2 class="section-title text-center mb-4">Diagnosis Panel</h2>
        <div class="row" id="diagnosisGrid">
        </div>

    </div>

    <script>
        // Wikipedia Mapping Logic
        function getWikiLink(diseaseName) {
            const name = diseaseName.toLowerCase();

            // Corn
            if (name.includes("corn") || name.includes("maize")) {
                if (name.includes("gray leaf spot") || name.includes("cercospora")) return "https://en.wikipedia.org/wiki/Gray_leaf_spot";
                if (name.includes("northern leaf blight")) return "https://en.wikipedia.org/wiki/Northern_corn_leaf_blight";
                if (name.includes("rust")) return "https://en.wikipedia.org/wiki/Common_corn_rust";
                if (name.includes("healthy")) return "https://en.wikipedia.org/wiki/Maize";
            }
            // Rice
            if (name.includes("rice")) {
                if (name.includes("bacterial blight")) return "https://en.wikipedia.org/wiki/Bacterial_blight_of_rice";
                if (name.includes("blast")) return "https://en.wikipedia.org/wiki/Rice_blast";
            }
            // Wheat
            if (name.includes("wheat")) {
                if (name.includes("brown") || name.includes("leaf rust")) return "https://en.wikipedia.org/wiki/Leaf_rust_(wheat)";
                if (name.includes("black rust")) return "https://en.wikipedia.org/wiki/Stem_rust";
                if (name.includes("yellow rust")) return "https://en.wikipedia.org/wiki/Wheat_stripe_rust";
                if (name.includes("leaf blight") || name.includes("septoria")) return "https://en.wikipedia.org/wiki/Septoria_tritici_blotch";
                if (name.includes("powdery mildew")) return "https://en.wikipedia.org/wiki/Blumeria_graminis_f._sp._tritici";
                if (name.includes("scab")) return "https://en.wikipedia.org/wiki/Fusarium_head_blight";
                if (name.includes("stem fly")) return "https://en.wikipedia.org/wiki/Atherigona_soccata";
                if (name.includes("aphid")) return "https://en.wikipedia.org/wiki/Schizaphis_graminum";
                if (name.includes("mite")) return "https://en.wikipedia.org/wiki/Penthaleus_major";
                if (name.includes("healthy")) return "https://en.wikipedia.org/wiki/Wheat";
            }
            // Cotton
            if (name.includes("cotton")) {
                if (name.includes("american bollworm")) return "https://en.wikipedia.org/wiki/Helicoverpa_armigera";
                if (name.includes("pink bollworm")) return "https://en.wikipedia.org/wiki/Pink_bollworm";
                if (name.includes("bollworm")) return "https://en.wikipedia.org/wiki/Bollworm";
                if (name.includes("aphid")) return "https://en.wikipedia.org/wiki/Aphis_gossypii";
                if (name.includes("mealy bug")) return "https://en.wikipedia.org/wiki/Phenacoccus_solenopsis";
                if (name.includes("whitefly")) return "https://en.wikipedia.org/wiki/Silverleaf_whitefly";
                if (name.includes("thirps") || name.includes("thrips")) return "https://en.wikipedia.org/wiki/Thrips";
                if (name.includes("red cotton bug")) return "https://en.wikipedia.org/wiki/Dysdercus_cingulatus";
                if (name.includes("anthracnose")) return "https://en.wikipedia.org/wiki/Colletotrichum_gossypii";
                if (name.includes("bacterial blight")) return "https://en.wikipedia.org/wiki/Xanthomonas_citri_subsp._malvacearum";
                if (name.includes("healthy")) return "https://en.wikipedia.org/wiki/Cotton";
            }
            // Sugarcane
            if (name.includes("sugarcane")) {
                if (name.includes("red rot")) return "https://en.wikipedia.org/wiki/Glomerella_tucumanensis";
                if (name.includes("red rust")) return "https://en.wikipedia.org/wiki/Puccinia_melanocephala";
                if (name.includes("yellow rust")) return "https://en.wikipedia.org/wiki/Puccinia_kuehnii";
                if (name.includes("mosaic")) return "https://en.wikipedia.org/wiki/Sugarcane_mosaic_virus";
                if (name.includes("healthy")) return "https://en.wikipedia.org/wiki/Sugarcane";
            }
            // Tomato
            if (name.includes("tomato")) {
                if (name.includes("bacterial spot")) return "https://en.wikipedia.org/wiki/Xanthomonas_perforans";
                if (name.includes("early blight")) return "https://en.wikipedia.org/wiki/Alternaria_solani";
                if (name.includes("late blight")) return "https://en.wikipedia.org/wiki/Phytophthora_infestans";
                if (name.includes("leaf mold")) return "https://en.wikipedia.org/wiki/Passalora_fulva";
                if (name.includes("septoria")) return "https://en.wikipedia.org/wiki/Septoria_lycopersici";
                if (name.includes("target spot")) return "https://en.wikipedia.org/wiki/Corynespora_cassiicola";
                if (name.includes("yellow leaf curl")) return "https://en.wikipedia.org/wiki/Tomato_yellow_leaf_curl_virus";
                if (name.includes("mosaic")) return "https://en.wikipedia.org/wiki/Tomato_mosaic_virus";
                if (name.includes("spider mite")) return "https://en.wikipedia.org/wiki/Tetranychus_urticae";
                if (name.includes("healthy")) return "https://en.wikipedia.org/wiki/Tomato";
            }
            // Potato
            if (name.includes("potato")) {
                if (name.includes("early blight")) return "https://en.wikipedia.org/wiki/Alternaria_solani";
                if (name.includes("late blight")) return "https://en.wikipedia.org/wiki/Phytophthora_infestans";
                if (name.includes("healthy")) return "https://en.wikipedia.org/wiki/Potato";
            }
            // Pepper
            if (name.includes("pepper")) {
                if (name.includes("bacterial spot")) return "https://en.wikipedia.org/wiki/Xanthomonas_euvesicatoria";
                if (name.includes("healthy")) return "https://en.wikipedia.org/wiki/Bell_pepper";
            }
            // Grape
            if (name.includes("grape")) {
                if (name.includes("black rot")) return "https://en.wikipedia.org/wiki/Black_rot_(grape)";
                if (name.includes("esca") || name.includes("measles")) return "https://en.wikipedia.org/wiki/Esca_(grape_disease)";
                if (name.includes("leaf blight") || name.includes("isariopsis")) return "https://en.wikipedia.org/wiki/Pseudocercospora_vitis";
                if (name.includes("healthy")) return "https://en.wikipedia.org/wiki/Grape";
            }

            // Fallback
            return "https://en.wikipedia.org/wiki/Plant_pathology";
        }

        // General Remedy Database
        function getRemedies(diseaseName) {
            const name = diseaseName.toLowerCase();

            if (name.includes("healthy")) {
                return { type: "healthy", text: "Your crop looks perfectly healthy! Continue your regular watering and fertilizer schedule. Monitor weekly for any changes." };
            }
            if (name.includes("blight")) {
                return { type: "disease", text: "Remove and destroy infected leaves. Apply copper-based fungicides or Mancozeb. Ensure proper spacing for air circulation and avoid overhead watering." };
            }
            if (name.includes("rust")) {
                return { type: "disease", text: "Apply sulfur or triazole-based fungicides. Remove heavily infected plants. Practice crop rotation and avoid excessive nitrogen fertilizers." };
            }
            if (name.includes("bollworm") || name.includes("pest") || name.includes("aphid") || name.includes("mite") || name.includes("bug") || name.includes("whitefly") || name.includes("thirps") || name.includes("fly")) {
                return { type: "disease", text: "Use Neem oil or insecticidal soap for early stages. Introduce natural predators like ladybugs. For severe infestations, use approved systemic insecticides." };
            }
            if (name.includes("virus") || name.includes("mosaic") || name.includes("curl")) {
                return { type: "disease", text: "Viral diseases cannot be cured. Immediately uproot and burn infected plants to prevent spread. Control insects (like whiteflies/aphids) that carry the virus." };
            }
            if (name.includes("spot") || name.includes("rot") || name.includes("mold") || name.includes("mildew") || name.includes("anthracnose") || name.includes("fungal") || name.includes("scab")) {
                return { type: "disease", text: "Apply broad-spectrum fungicides. Prune plants to improve airflow. Water the base of the plant in the morning to allow leaves to dry." };
            }
            if (name.includes("bacterial")) {
                return { type: "disease", text: "Apply copper-based bactericides. Sanitize pruning tools between cuts. Do not work in fields when foliage is wet to avoid spreading bacteria." };
            }

            return { type: "disease", text: "Isolate the affected plant. Consult a local agricultural extension officer for specific localized treatments. Remove heavily damaged leaves." };
        }

        // Generate Panels: Panel 1 is always visible. Panels 2, 3, 4 are hidden on mobile (d-none) but visible on desktop (d-md-block).
        const grid = document.getElementById('diagnosisGrid');
        for (let i = 1; i <= 4; i++) {
            const visibilityClass = i === 1 ? '' : 'd-none d-md-block';

            grid.innerHTML += `
                <div class="col-12 col-md-3 mb-4 ${visibilityClass}">
                    <div class="google-card p-4 text-center d-flex flex-column" id="panel-${i}">
                        <h5 class="mb-3 text-muted">Panel ${i}</h5>
                        <form id="form-${i}" class="mb-auto">
                            <input class="form-control-file mb-3" type="file" id="file-${i}" accept="image/*" required>
                            <img id="preview-${i}" class="img-fluid w-100 mb-3 image-preview" alt="Image Preview">
                            <button type="submit" class="btn btn-google w-100" id="btn-${i}">Analyze Crop</button>
                        </form>
                        
                        <div id="loading-${i}" class="mt-4" style="display: none;">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="mt-2 text-muted small">Running AI Analysis...</p>
                        </div>

                        <div id="result-${i}" class="mt-4" style="display: none;">
                            </div>
                    </div>
                </div>
            `;
        }

        // Attach event listeners
        for (let i = 1; i <= 4; i++) {
            const fileInput = document.getElementById(`file-${i}`);
            const preview = document.getElementById(`preview-${i}`);
            const form = document.getElementById(`form-${i}`);
            const btn = document.getElementById(`btn-${i}`);
            const loading = document.getElementById(`loading-${i}`);
            const resultBox = document.getElementById(`result-${i}`);

            fileInput.addEventListener('change', function () {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                        resultBox.style.display = 'none';
                    }
                    reader.readAsDataURL(file);
                }
            });

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const formData = new FormData();
                formData.append('file', fileInput.files[0]);

                loading.style.display = 'block';
                resultBox.style.display = 'none';
                btn.disabled = true;

                try {
                    const response = await fetch('/predict', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();
                    loading.style.display = 'none';
                    btn.disabled = false;

                    if (data.success) {
                        if (data.confidence > 60) {
                            const remedyData = getRemedies(data.disease);
                            const wikiUrl = getWikiLink(data.disease);
                            const boxClass = remedyData.type === 'healthy' ? 'healthy-box' : 'remedy-box';
                            const titleColor = remedyData.type === 'healthy' ? '#1e8e3e' : '#d93025';

                            resultBox.innerHTML = `
                                <h4 class="fw-bold mb-1" style="color: ${titleColor};">${data.disease}</h4>
                                <p class="mb-3 text-muted small">AI Confidence: <strong>${data.confidence}%</strong></p>
                                <div class="${boxClass} mb-3">
                                    <strong>Action Required:</strong><br>
                                    ${remedyData.text}
                                </div>
                                <a href="${wikiUrl}" target="_blank" class="btn btn-wiki w-100">
                                    📖 Know More on Wikipedia
                                </a>
                            `;
                        } else {
                            resultBox.innerHTML = `
                                <div class="alert alert-warning text-dark border-warning" role="alert">
                                    <h6 class="fw-bold">Model Unsure (${data.confidence}%)</h6>
                                    Image is unclear or disease is not recognized. <strong>Please upload a clearer, closer image of the leaf.</strong>
                                </div>
                            `;
                        }
                    } else {
                        resultBox.innerHTML = `<div class="alert alert-danger">Error: ${data.error}</div>`;
                    }
                    resultBox.style.display = 'block';

                } catch (error) {
                    loading.style.display = 'none';
                    btn.disabled = false;
                    resultBox.innerHTML = `<div class="alert alert-danger">Server connection failed.</div>`;
                    resultBox.style.display = 'block';
                }
            });
        }
    </script>
</body>

</html>
